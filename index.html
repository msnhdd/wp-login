<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WP Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <img src="https://wordpress.org/about/images/logos/wordpress-logo-stacked-rgb.png" alt="لوگوی سایت">
        <h1>ورود به سایت</h1>
        <form action="/login" method="post">
            <input type="text" name="username" placeholder="نام کاربری" required>
            <input type="password" name="password" placeholder="رمز عبور" required>
            <input type="submit" value="ورود">
        </form>
        <a href="/forgot-password" class="forgot-password">رمز عبور خود را فراموش کرده‌اید؟</a>
        <a href="/" class="back-to-site">بازگشت به سایت</a>
    </div>
</body>
</html>
